<svg xmlns="http://www.w3.org/2000/svg" width="680" height="784" viewBox="0 0 680 784" role="img" aria-labelledby="title-boundaries desc-boundaries"><title id="title-boundaries">Protection boundaries</title><desc id="desc-boundaries">The V8 heap and other renderer memory are within a renderer process. OS resource access is governed by a separate process security boundary.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10" fill="#52616c"/></marker></defs><rect width="680" height="784" rx="20" fill="#13171b"/><g font-family="DejaVu Sans,Arial,sans-serif"><text x="32" y="44" fill="#adbbc6" font-size="16" font-weight="600" text-anchor="start">ZZoMb1E   /   RESEARCH NOTES</text><text x="32" y="100" fill="#ecf1f4" font-size="34" font-weight="600" text-anchor="start">Protection boundaries</text><rect x="28" y="135" width="624" height="413" rx="16" fill="#1c2228" stroke="#52616c" stroke-width="1.5"/><text x="52" y="173" fill="#adbbc6" font-size="22" font-weight="600" text-anchor="start">RENDERER PROCESS</text><rect x="64" y="198" width="552" height="114" rx="16" fill="#1c2228" stroke="#a8dfc7" stroke-width="1.5"/><text x="340" y="245" fill="#ecf1f4" font-size="34" font-weight="600" text-anchor="middle">V8 heap</text><text x="340" y="281" fill="#adbbc6" font-size="23" font-weight="400" text-anchor="middle">JavaScript / WebAssembly objects</text><path d="M340 312L340 344" stroke="#52616c" stroke-width="2" marker-end="url(#arrow)"/><rect x="104" y="346" width="472" height="66" rx="16" fill="#1c2228" stroke="#52616c" stroke-width="1.5"/><text x="340" y="388" fill="#a8dfc7" font-size="25" font-weight="500" text-anchor="middle">Indirect references + checks</text><path d="M340 412L340 445" stroke="#52616c" stroke-width="2" marker-end="url(#arrow)"/><rect x="64" y="447" width="552" height="74" rx="16" fill="#1c2228" stroke="#52616c" stroke-width="1.5"/><text x="340" y="493" fill="#ecf1f4" font-size="28" font-weight="500" text-anchor="middle">Other renderer memory</text><path d="M32 586H200M480 586H648" stroke="#52616c" stroke-width="1.5" stroke-dasharray="5 6"/><text x="340" y="594" fill="#edc48b" font-size="26" font-weight="500" text-anchor="middle">OS boundary</text><rect x="64" y="623" width="552" height="112" rx="16" fill="#1c2228" stroke="#edc48b" stroke-width="1.5"/><text x="340" y="670" fill="#ecf1f4" font-size="32" font-weight="600" text-anchor="middle">OS resources</text><text x="340" y="706" fill="#adbbc6" font-size="23" font-weight="400" text-anchor="middle">Access follows process policy</text></g></svg>