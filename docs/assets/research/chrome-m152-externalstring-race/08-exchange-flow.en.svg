<svg xmlns="http://www.w3.org/2000/svg" width="680" height="1480" viewBox="0 0 680 1480" role="img" aria-labelledby="title desc"><title id="title">B · exchange calls and build branch</title><desc id="desc">ExternalPointerMember exchange delegates to a field operation. The sandbox path reads one handle and exchanges an EPT entry; the other path reads and writes an address field.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 Z" fill="#a8dfc7"/></marker><marker id="retry" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 Z" fill="#edc48b"/></marker></defs><rect width="680" height="1480" rx="16" fill="#111519"/><text x="340" y="45" text-anchor="middle" fill="#a8dfc7" font-size="28" font-family="system-ui,Malgun Gothic,Noto Sans KR,sans-serif"><tspan x="340" dy="0">B · exchange calls and build branch</tspan></text><rect x="65" y="85" width="550" height="120" rx="12" fill="#191f25" stroke="#3f4b55" stroke-width="2"/><text x="340.0" y="136.66" text-anchor="middle" fill="#e7edf1" font-size="24" font-family="system-ui,Malgun Gothic,Noto Sans KR,sans-serif"><tspan x="340.0" dy="0">ExternalPointerMember::exchange</tspan><tspan x="340.0" dy="33">single tag → exchange&lt;tag&gt;</tspan></text><path d="M340,205 V245" fill="none" stroke="#a8dfc7" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="65" y="245" width="550" height="130" rx="12" fill="#191f25" stroke="#3f4b55" stroke-width="2"/><text x="340.0" y="285.16" text-anchor="middle" fill="#e7edf1" font-size="24" font-family="system-ui,Malgun Gothic,Noto Sans KR,sans-serif"><tspan x="340.0" dy="0">exchange&lt;tag&gt;</tspan><tspan x="340.0" dy="33">storage_ → field_address</tspan><tspan x="340.0" dy="33">forward isolate / value</tspan></text><path d="M340,375 V415" fill="none" stroke="#a8dfc7" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="65