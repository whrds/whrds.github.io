<svg xmlns="http://www.w3.org/2000/svg" width="680" height="786" viewBox="0 0 680 786" role="img" aria-labelledby="title-research desc-research"><title id="title-research">Questions behind the research</title><desc id="desc-research">Four research questions connect source reasoning, observation, browser context and interpretation. They are not exploit steps.</desc><rect width="680" height="786" rx="20" fill="#13171b"/><g font-family="DejaVu Sans,Arial,sans-serif"><text x="32" y="44" fill="#adbbc6" font-size="24" font-weight="500" text-anchor="start">ZZoMb1E / RESEARCH NOTES</text><text x="32" y="102" fill="#ecf1f4" font-size="34" font-weight="600" text-anchor="start">Questions behind the research</text><rect x="32" y="156" width="616" height="130" rx="14" fill="#1c2228" stroke="#52616c" stroke-width="1.5"/><text x="54" y="189" fill="#a8dfc7" font-size="24" font-weight="500" text-anchor="start">SOURCE</text><text x="54" y="231" fill="#ecf1f4" font-size="27" font-weight="600" text-anchor="start">Which assumption can fail?</text><text x="54" y="267" fill="#adbbc6" font-size="25" font-weight="400" text-anchor="start">Target identity during cleanup</text><rect x="32" y="302" width="616" height="130" rx="14" fill="#1c2228" stroke="#52616c" stroke-width="1.5"/><text x="54" y="335" fill="#a8dfc7" font-size="24" font-weight="500" text-anchor="start">OBSERVATION</text><text x="54" y="377" fill="#ecf1f4" font-size="27" font-weight="600" text-anchor="start">What actually happened?</text><text x="54" y="413" fill="#adbbc6" font-size="25" font-weight="400" text-anchor="start">Lifetime evidence, not just a crash</text><rect x="32" y="448" width="616" height="130" rx="14" fill="#1c2228" stroke="#52616c" stroke-width="1.5"/><text x="54" y="481" fill="#a8dfc7" font-size="24" font-weight="500" text-anchor="start">BROWSER CONTEXT</text><text x="54" y="523" fill="#ecf1f4" font-size="27" font-weight="600" text-anchor="start">What changes with the environment?</text><text x="54" y="559" fill="#adbbc6" font-size="25" font-weight="400" text-anchor="start">Ownership, caching and allocation</text><rect x="32" y="594" width="616" height="130" rx="14" fill="#1c2228" stroke="#52616c" stroke-width="1.5"/><text x="54" y="627" fill="#a8dfc7" font-size="24" font-weight="500" text-anchor="start">INTERPRETATION</text><text x="54" y="669" fill="#ecf1f4" font-size="27" font-weight="600" text-anchor="start">What does the result establish?</text><text x="54" y="705" fill="#adbbc6" font-size="25" font-weight="400" text-anchor="start">Defined outcomes and trial units</text></g></svg>