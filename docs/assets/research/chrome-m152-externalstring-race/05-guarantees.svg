<svg xmlns="http://www.w3.org/2000/svg" width="680" height="786" viewBox="0 0 680 786" role="img" aria-labelledby="title-guarantees desc-guarantees"><title id="title-guarantees">Separate protection properties</title><desc id="desc-guarantees">Reference path, lifetime, control flow and OS privileges each answer a different question.</desc><rect width="680" height="786" rx="20" fill="#13171b"/><g font-family="DejaVu Sans,Arial,sans-serif"><text x="32" y="44" fill="#adbbc6" font-size="24" font-weight="500" text-anchor="start">ZZoMb1E / RESEARCH NOTES</text><text x="32" y="102" fill="#ecf1f4" font-size="34" font-weight="600" text-anchor="start">Separate protection properties</text><rect x="32" y="156" width="616" height="130" rx="14" fill="#1c2228" stroke="#52616c" stroke-width="1.5"/><text x="54" y="189" fill="#a8dfc7" font-size="24" font-weight="500" text-anchor="start">REFERENCE PATH</text><text x="54" y="231" fill="#ecf1f4" font-size="29" font-weight="600" text-anchor="start">Is the reference allowed?</text><text x="54" y="267" fill="#adbbc6" font-size="25" font-weight="400" text-anchor="start">Does not establish object liveness</text><rect x="32" y="302" width="616" height="130" rx="14" fill="#1c2228" stroke="#52616c" stroke-width="1.5"/><text x="54" y="335" fill="#a8dfc7" font-size="24" font-weight="500" text-anchor="start">LIFETIME</text><text x="54" y="377" fill="#ecf1f4" font-size="29" font-weight="600" text-anchor="start">Is the same object still alive?</text><text x="54" y="413" fill="#adbbc6" font-size="25" font-weight="400" text-anchor="start">Does not establish call validity</text><rect x="32" y="448" width="616" height="130" rx="14" fill="#1c2228" stroke="#52616c" stroke-width="1.5"/><text x="54" y="481" fill="#a8dfc7" font-size="24" font-weight="500" text-anchor="start">CONTROL FLOW</text><text x="54" y="523" fill="#ecf1f4" font-size="29" font-weight="600" text-anchor="start">Is this call permitted?</text><text x="54" y="559" fill="#adbbc6" font-size="25" font-weight="400" text-anchor="start">Does not repair ownership state</text><rect x="32" y="594" width="616" height="130" rx="14" fill="#1c2228" stroke="#52616c" stroke-width="1.5"/><text x="54" y="627" fill="#a8dfc7" font-size="24" font-weight="500" text-anchor="start">OS PRIVILEGES</text><text x="54" y="669" fill="#ecf1f4" font-size="29" font-weight="600" text-anchor="start">Is access allowed for this process?</text><text x="54" y="705" fill="#adbbc6" font-size="25" font-weight="400" text-anchor="start">Does not prove privilege escalation</text></g></svg>