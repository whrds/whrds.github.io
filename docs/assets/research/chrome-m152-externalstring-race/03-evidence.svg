<svg xmlns="http://www.w3.org/2000/svg" width="680" height="832" viewBox="0 0 680 832" role="img" aria-labelledby="title-evidence desc-evidence"><title id="title-evidence">Reading the evidence</title><desc id="desc-evidence">Symptoms, causes, outcomes and rates are different claims. Each requires its own evidence.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10" fill="#52616c"/></marker></defs><rect width="680" height="832" rx="20" fill="#13171b"/><g font-family="DejaVu Sans,Arial,sans-serif"><text x="32" y="44" fill="#adbbc6" font-size="16" font-weight="600" text-anchor="start">ZZoMb1E   /   RESEARCH NOTES</text><text x="32" y="100" fill="#ecf1f4" font-size="34" font-weight="600" text-anchor="start">Reading the evidence</text><text x="32" y="139" fill="#adbbc6" font-size="23" font-weight="400" text-anchor="start">Separate claims need separate evidence.</text><rect x="32" y="178" width="616" height="126" rx="16" fill="#1c2228" stroke="#52616c" stroke-width="1.5"/><text x="60" y="222" fill="#a8dfc7" font-size="22" font-weight="600" text-anchor="start">01</text><text x="118" y="226" fill="#ecf1f4" font-size="31" font-weight="600" text-anchor="start">Symptom</text><text x="118" y="270" fill="#adbbc6" font-size="23" font-weight="400" text-anchor="start">A recorded crash</text><rect x="32" y="329" width="616" height="126" rx="16" fill="#1c2228" stroke="#52616c" stroke-width="1.5"/><text x="60" y="373" fill="#a8dfc7" font-size="22" font-weight="600" text-anchor="start">02</text><text x="118" y="377" fill="#ecf1f4" font-size="31" font-weight="600" text-anchor="start">Cause</text><text x="118" y="421" fill="#adbbc6" font-size="23" font-weight="400" text-anchor="start">Evidence of the lifetime violation</text><rect x="32" y="480" width="616" height="126" rx="16" fill="#1c2228" stroke="#52616c" stroke-width="1.5"/><text x="60" y="524" fill="#a8dfc7" font-size="22" font-weight="600" text-anchor="start">03</text><text x="118" y="528" fill="#ecf1f4" font-size="31" font-weight="600" text-anchor="start">Outcome</text><text x="118" y="572" fill="#adbbc6" font-size="23" font-weight="400" text-anchor="start">A record of the defined result</text><rect x="32" y="631" width="616" height="126" rx="16" fill="#1c2228" stroke="#edc48b" stroke-width="1.5"/><text x="60" y="675" fill="#a8dfc7" font-size="22" font-weight="600" text-anchor="start">04</text><text x="118" y="679" fill="#ecf1f4" font-size="31" font-weight="600" text-anchor="start">Observed rate</text><text x="118" y="723" fill="#adbbc6" font-size="23" font-weight="400" text-anchor="start">n / N + the test conditions</text></g></svg>