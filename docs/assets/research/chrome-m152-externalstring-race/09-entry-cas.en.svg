<svg xmlns="http://www.w3.org/2000/svg" width="680" height="1390" viewBox="0 0 680 1390" role="img" aria-labelledby="title desc"><title id="title">C · EPT payload CAS loop</title><desc id="desc">Fixed ExchangeExternalPointer flow: load expected payload, construct replacement, preserve the observed mark, retry weak CAS on failure, and return the previous pointer on success.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 Z" fill="#a8dfc7"/></marker><marker id="retry" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 Z" fill="#edc48b"/></marker></defs><rect width="680" height="1390" rx="16" fill="#111519"/><text x="340" y="45" text-anchor="middle" fill="#a8dfc7" font-size="28" font-family="system-ui,Malgun Gothic,Noto Sans KR,sans-serif"><tspan x="340" dy="0">C · EPT payload CAS loop</tspan></text><rect x="80" y="85" width="520" height="110" rx="12" fill="#191f25" stroke="#3f4b55" stroke-width="2"/><text x="340.0" y="115.16" text-anchor="middle" fill="#e7edf1" font-size="24" font-family="system-ui,Malgun Gothic,Noto Sans KR,sans-serif"><tspan x="340.0" dy="0">ExternalPointerTableEntry</tspan><tspan x="340.0" dy="33">::ExchangeExternalPointer(value, tag)</tspan><tspan x="340.0" dy="33">DCHECK: tag/mark bits == 0</tspan></text><path d="M340,195 V235" fill="none" stroke="#a8dfc7" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="80" y="235" width="520" height="95" rx="12" fill="#191f25" stroke="#3f4b55" stroke-width="2"/><text x="340.0" y="290.66" text-anchor="middle" fill="#e7edf1" font-size="24" font-family="system-ui,Malgun Gothic,Noto Sans KR,sans-serif"><tspan x="340.0" dy="0">old_payload = payload_.load(relaxed)</tspan></text><path d="M340,330 V370" fill="none" stroke="#a8dfc7" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="80" y="370" width="520" height="105" rx="12" fill="#191f25" stroke="#3f4b55" stroke-width="2"/><text x="340.0" y="414.16" text-anchor="middle" fill="#e7edf1" font-size="24" font-family="system-ui,Malgun Gothic,Noto Sans KR,sans-serif"><tspan x="340.0" dy="0">DCHECK: ContainsPointer()</tspan><tspan x="340.0" dy="33">new_payload = Payload(value, tag)</tspan></text><path d="M340,475 V505" fill="none" stroke="#a8dfc7" stroke-width="2.5" marker-end="url(#arrow)"/><polygon points="340.0,505 590,575.0 340.0,645 90,575.0" fill="#1c2928" stroke="#a8dfc7" stroke-width="2"/><text x="340.0" y="583.16" text-anchor="middle" fill="#e7edf1" font-size="24" font-family="system-ui,Malgun Gothic,Noto Sans KR,sans-serif"><tspan x="340.0" dy="0">old_payload.HasMarkBitSet() ?</tspan></text><path d="M340,645 V690" fill="none" stroke="#a8dfc7" stroke-width="2.5" marker-end="url(#arrow)"/><text x="365" y="673" text-anchor="start" fill="#e7edf1" font-size="22" font-family="system-ui,Malgun Gothic,Noto Sans KR,sans-serif"><tspan x="365" dy="0">yes</tspan></text><rect x="125" y="690" width="430" height="85" rx="12" fill="#191f25" stroke="#3f4b55" stroke-width="2"/><text x="340.0" y="740.66" text-anchor="middle" fill="#e7edf1" font-size="24" font-family="system-ui,Malgun Gothic,Noto Sans KR,sans-serif"><tspan x="340.0" dy="0">new_payload.SetMarkBit()</tspan></text><path d="M340,775 V820" fill="none" stroke="#a8dfc7" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M590,575 H620 V925 H585" fill="none" stroke="#a8dfc7" stroke-width="2.5" marker-end="url(#arrow)"/><text x="600" y="545" text-anchor="middle" fill="#e7edf1" font-size="22" font-family="system-ui,Malgun Gothic,Noto Sans KR,sans-serif"><tspan x="600" dy="0">no</tspan></text><polygon points="340.0,820 585,925.0 340.0,1030 95,925.0" fill="#1c2928" stroke="#a8dfc7" stroke-width="2"/><text x="340.0" y="901.48" text-anchor="middle" fill="#e7edf1" font-size="22" font-family="system-ui,Malgun Gothic,Noto Sans KR,sans-serif"><tspan x="340.0" dy="0">compare_exchange_weak</tspan><tspan x="340.0" dy="31">(old_payload, new_payload,</tspan><tspan x="340.0" dy="31">relaxed)</tspan></text><path d="M95,925 H42 V423 H80" fill="none" stroke="#edc48b" stroke-width="2.5" marker-end="url(#retry)"/><text x="70" y="1035" text-anchor="start" fill="#edc48b" font-size="22" font-family="system-ui,Malgun Gothic,Noto Sans KR,sans-serif"><tspan x="70" dy="0">failure: refresh</tspan><tspan x="70" dy="31">expected; rebuild</tspan><tspan x="70" dy="31">the payload</tspan></text><path d="M340,1030 V1130" fill="none" stroke="#a8dfc7" stroke-width="2.5" marker-end="url(#arrow)"/><text x="365" y="1090" text-anchor="start" fill="#e7edf1" font-size="22" font-family="system-ui,Malgun Gothic,Noto Sans KR,sans-serif"><tspan x="365" dy="0">success</tspan></text><rect x="80" y="1130" width="520" height="95" rx="12" fill="#191f25" stroke="#3f4b55" stroke-width="2"/><text x="340.0" y="1184.98" text-anchor="middle" fill="#e7edf1" font-size="22" font-family="system-ui,Malgun Gothic,Noto Sans KR,sans-serif"><tspan x="340.0" dy="0">MaybeUpdateRawPointerForLSan(value)</tspan></text><path d="M340,1225 V1270" fill="none" stroke="#a8dfc7" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="80" y="1270" width="520" height="80" rx="12" fill="#191f25" stroke="#3f4b55" stroke-width="2"/><text x="340.0" y="1318.16" text-anchor="middle" fill="#e7edf1" font-size="24" font-family="system-ui,Malgun Gothic,Noto Sans KR,sans-serif"><tspan x="340.0" dy="0">return old_payload.Untag(tag)</tspan></text></svg>
