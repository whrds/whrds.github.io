<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 650" role="img" aria-labelledby="title desc" lang="ko">
<title id="title">해시를 아는 것과 출처를 신뢰하는 것</title><desc id="desc">A known binary fingerprint supports equality checks but leaves publisher and behavioral trust separate.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b5c7cc"/></marker></defs>
<rect width="960" height="650" rx="22" fill="#10191e"/>
<g font-family="Noto Sans CJK KR, Noto Sans KR, Malgun Gothic, Apple SD Gothic Neo, Arial, sans-serif"><text x="44" y="42" fill="#78d6be" font-size="15" font-weight="600" text-anchor="start">RAW13G / SOURCE &amp; EVIDENCE REVIEW</text><text x="44" y="89" fill="#edf5f4" font-size="30" font-weight="700" text-anchor="start">해시를 아는 것과 출처를 신뢰하는 것</text><rect x="188" y="122" width="584" height="103" rx="16" fill="#19272e" stroke="#3b515c" stroke-width="1.5"/><text x="480" y="161" fill="#edf5f4" font-size="25" font-weight="600" text-anchor="middle">분석할 바이너리의 바이트를 고정</text><text x="480" y="198" fill="#b5c7cc" font-size="22" font-weight="400" text-anchor="middle">파일명 + 크기 + SHA-256</text><path d="M 480 225 V 264 H 252 V 307" fill="none" stroke="#b5c7cc" stroke-width="2" marker-end="url(#arrow)"/><path d="M 480 225 V 264 H 708 V 307" fill="none" stroke="#b5c7cc" stroke-width="2" marker-end="url(#arrow)"/><rect x="40" y="309" width="424" height="247" rx="16" fill="#19272e" stroke="#78d6be" stroke-width="1.5"/><rect x="496" y="309" width="424" height="247" rx="16" fill="#19272e" stroke="#efbd79" stroke-width="1.5"/><text x="65" y="351" fill="#78d6be" font-size="24" font-weight="600" text-anchor="start">확인된 동일성</text><text x="65" y="397" fill="#edf5f4" font-size="20" font-weight="400" text-anchor="start">보관된 source/deployed가 같음</text><text x="65" y="431" fill="#edf5f4" font-size="20" font-weight="400" text-anchor="start">두 payload 파일의 내용이 같음</text><text x="65" y="465" fill="#edf5f4" font-size="20" font-weight="400" text-anchor="start"></text><text x="65" y="499" fill="#edf5f4" font-size="20" font-weight="400" text-anchor="start">이 비교는 해당 사본에 한정</text><text x="521" y="351" fill="#efbd79" font-size="24" font-weight="600" text-anchor="start">별도로 필요한 신뢰 근거</text><text x="521" y="397" fill="#edf5f4" font-size="20" font-weight="400" text-anchor="start">신뢰할 제작자와 릴리스의 연결</text><text x="521" y="431" fill="#edf5f4" font-size="20" font-weight="400" text-anchor="start">서명 또는 소스·빌드 추적</text><text x="521" y="465" fill="#edf5f4" font-size="20" font-weight="400" text-anchor="start">내부 동작을 검토한 자료</text><text x="521" y="499" fill="#edf5f4" font-size="20" font-weight="400" text-anchor="start">이 패키지로는 확정하지 못함</text><text x="44" y="610" fill="#b5c7cc" font-size="22" font-weight="400" text-anchor="start">해시 목록 자체를 누구에게서 받았는지도 확인해야 한다.</text></g></svg>