<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 671" role="img" aria-labelledby="title desc" lang="en">
<title id="title">Display formatting and request data diverge</title><desc id="desc">Original detail reaches same-origin POST independently of shortened display text. Receipt is unknown.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b5c7cc"/></marker></defs>
<rect width="960" height="671" rx="22" fill="#10191e"/>
<g font-family="Noto Sans CJK KR, Noto Sans KR, Malgun Gothic, Apple SD Gothic Neo, Arial, sans-serif"><text x="44" y="42" fill="#78d6be" font-size="15" font-weight="600" text-anchor="start">RAW13G / SOURCE &amp; EVIDENCE REVIEW</text><text x="44" y="89" fill="#edf5f4" font-size="30" font-weight="700" text-anchor="start">Display formatting and request data diverge</text><rect x="285" y="126" width="390" height="90" rx="16" fill="#19272e" stroke="#3b515c" stroke-width="1.5"/><text x="480" y="164" fill="#edf5f4" font-size="25" font-weight="600" text-anchor="middle">Original diagnostic detail</text><text x="480" y="194" fill="#b5c7cc" font-size="20" font-weight="400" text-anchor="middle">detail / raw</text><path d="M 480 216 V 249 H 252 V 286" fill="none" stroke="#b5c7cc" stroke-width="2" marker-end="url(#arrow)"/><path d="M 480 216 V 249 H 708 V 286" fill="none" stroke="#b5c7cc" stroke-width="2" marker-end="url(#arrow)"/><rect x="40" y="288" width="424" height="112" rx="16" fill="#19272e" stroke="#78d6be" stroke-width="1.5"/><rect x="496" y="288" width="424" height="112" rx="16" fill="#19272e" stroke="#78d6be" stroke-width="1.5"/><text x="252" y="329" fill="#78d6be" font-size="24" font-weight="600" text-anchor="middle">terse(detail)</text><text x="252" y="368" fill="#b5c7cc" font-size="22" font-weight="400" text-anchor="middle">Shortens the display text</text><text x="708" y="329" fill="#78d6be" font-size="24" font-weight="600" text-anchor="middle">post(tag, raw)</text><text x="708" y="368" fill="#b5c7cc" font-size="22" font-weight="400" text-anchor="middle">Passes the original detail</text><path d="M 252 400 V 463" fill="none" stroke="#b5c7cc" stroke-width="2" marker-end="url(#arrow)"/><path d="M 708 400 V 463" fill="none" stroke="#b5c7cc" stroke-width="2" marker-end="url(#arrow)"/><rect x="40" y="465" width="424" height="114" rx="16" fill="#19272e" stroke="#3b515c" stroke-width="1.5"/><rect x="496" y="465" width="424" height="114" rx="16" fill="#19272e" stroke="#efbd79" stroke-width="1.5" stroke-dasharray="7 6"/><text x="252" y="507" fill="#edf5f4" font-size="25" font-weight="600" text-anchor="middle">Visible log</text><text x="252" y="549" fill="#b5c7cc" font-size="20" font-weight="400" text-anchor="middle">Visibility and length are controlled</text><text x="708" y="507" fill="#efbd79" font-size="25" font-weight="600" text-anchor="middle">POST /t</text><text x="708" y="549" fill="#b5c7cc" font-size="20" font-weight="400" text-anchor="middle">Receipt and retention unverified</text><text x="44" y="636" fill="#b5c7cc" font-size="21" font-weight="400" text-anchor="start">A request path in source; actual traffic was not captured.</text></g></svg>