<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 655" role="img" aria-labelledby="title desc" lang="ko">
<title id="title">같은 파일 · 관찰된 동작 · 신뢰할 출처</title><desc id="desc">Three independent evidence categories, their observed results, and limits.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b5c7cc"/></marker></defs>
<rect width="960" height="655" rx="22" fill="#10191e"/>
<g font-family="Noto Sans CJK KR, Noto Sans KR, Malgun Gothic, Apple SD Gothic Neo, Arial, sans-serif"><text x="44" y="42" fill="#78d6be" font-size="15" font-weight="600" text-anchor="start">RAW13G / SOURCE &amp; EVIDENCE REVIEW</text><text x="44" y="89" fill="#edf5f4" font-size="30" font-weight="700" text-anchor="start">같은 파일 · 관찰된 동작 · 신뢰할 출처</text><rect x="36" y="126" width="888" height="139" rx="16" fill="#19272e" stroke="#3b515c" stroke-width="1.5"/><rect x="36" y="144" width="4" height="103" rx="2" fill="#78d6be"/><text x="60" y="158" fill="#78d6be" font-size="21" font-weight="600" text-anchor="start">01  패키지 일치</text><text x="60" y="199" fill="#b5c7cc" font-size="21" font-weight="400" text-anchor="start">48개 매니페스트 일치</text><text x="60" y="230" fill="#b5c7cc" font-size="21" font-weight="400" text-anchor="start">15개 배포 파일 쌍 동일</text><text x="477" y="198" fill="#edf5f4" font-size="20" font-weight="400" text-anchor="start">보관한 사본끼리 비교한 결과</text><text x="477" y="230" fill="#edf5f4" font-size="20" font-weight="400" text-anchor="start">제작자 인증이나 실행 안전성은 별도</text><rect x="36" y="283" width="888" height="139" rx="16" fill="#19272e" stroke="#3b515c" stroke-width="1.5"/><rect x="36" y="301" width="4" height="103" rx="2" fill="#78d6be"/><text x="60" y="315" fill="#78d6be" font-size="21" font-weight="600" text-anchor="start">02  실행 관찰</text><text x="60" y="356" fill="#b5c7cc" font-size="21" font-weight="400" text-anchor="start">두 시점의 TCP 상태 기록</text><text x="60" y="387" fill="#b5c7cc" font-size="21" font-weight="400" text-anchor="start">GoldHEN 표시는 운영자 관찰</text><text x="477" y="355" fill="#edf5f4" font-size="20" font-weight="400" text-anchor="start">기록된 시각의 연결 수락 여부</text><text x="477" y="387" fill="#edf5f4" font-size="20" font-weight="400" text-anchor="start">서비스 종류·권한·성공률은 미확정</text><rect x="36" y="440" width="888" height="139" rx="16" fill="#19272e" stroke="#3b515c" stroke-width="1.5"/><rect x="36" y="458" width="4" height="103" rx="2" fill="#efbd79"/><text x="60" y="472" fill="#efbd79" font-size="21" font-weight="600" text-anchor="start">03  출처와 내부 동작</text><text x="60" y="513" fill="#b5c7cc" font-size="21" font-weight="400" text-anchor="start">바이너리 해시와 크기 확보</text><text x="60" y="544" fill="#b5c7cc" font-size="21" font-weight="400" text-anchor="start">완결된 빌드·서명 자료 미포함</text><text x="477" y="512" fill="#edf5f4" font-size="20" font-weight="400" text-anchor="start">분석 대상을 식별할 수 있음</text><text x="477" y="544" fill="#edf5f4" font-size="20" font-weight="400" text-anchor="start">내부 구현과 신뢰는 추가 근거 필요</text><text x="44" y="626" fill="#b5c7cc" font-size="21" font-weight="400" text-anchor="start">판정의 범위는 근거의 범위를 넘지 않는다.</text></g></svg>