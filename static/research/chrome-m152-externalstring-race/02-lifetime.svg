<svg xmlns="http://www.w3.org/2000/svg" width="680" height="744" viewBox="0 0 680 744" role="img" aria-labelledby="title-lifetime desc-lifetime"><title id="title-lifetime">Lifetime and reference state</title><desc id="desc-lifetime">A live object has a valid reference; after release the reference must be invalidated. A stale reference to a released object is an inconsistent state.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10" fill="#52616c"/></marker></defs><rect width="680" height="744" rx="20" fill="#13171b"/><g font-family="DejaVu Sans,Arial,sans-serif"><text x="32" y="44" fill="#adbbc6" font-size="16" font-weight="600" text-anchor="start">ZZoMb1E   /   RESEARCH NOTES</text><text x="32" y="100" fill="#ecf1f4" font-size="34" font-weight="600" text-anchor="start">Lifetime and reference state</text><text x="32" y="156" fill="#adbbc6" font-size="20" font-weight="600" text-anchor="start">OBJECT STATE</text><text x="390" y="156" fill="#adbbc6" font-size="20" font-weight="600" text-anchor="start">REFERENCE STATE</text><rect x="32" y="185" width="262" height="105" rx="16" fill="#1c2228" stroke="#a8dfc7" stroke-width="1.5"/><text x="163" y="249" fill="#a8dfc7" font-size="32" font-weight="600" text-anchor="middle">Live</text><path d="M296 237L382 237" stroke="#52616c" stroke-width="2" /><rect x="386" y="185" width="262" height="105" rx="16" fill="#1c2228" stroke="#a8dfc7" stroke-width="1.5"/><text x="517" y="249" fill="#a8dfc7" font-size="32" font-weight="600" text-anchor="middle">Valid</text><text x="340" y="318" fill="#adbbc6" font-size="18" font-weight="500" text-anchor="middle">CONSISTENT</text><rect x="32" y="348" width="262" height="105" rx="16" fill="#1c2228" stroke="#52616c" stroke-width="1.5"/><text x="163" y="412" fill="#ecf1f4" font-size="30" font-weight="500" text-anchor="middle">Released</text><path d="M296 400L382 400" stroke="#52616c" stroke-width="2" /><rect x="386" y="348" width="262" height="105" rx="16" fill="#1c2228" stroke="#52616c" stroke-width="1.5"/><text x="517" y="412" fill="#ecf1f4" font-size="29" font-weight="500" text-anchor="middle">Invalidated</text><text x="340" y="483" fill="#adbbc6" font-size="18" font-weight="500" text-anchor="middle">CONSISTENT</text><rect x="32" y="513" width="262" height="105" rx="16" fill="#1c2228" stroke="#edc48b" stroke-width="1.5"/><text x="163" y="577" fill="#edc48b" font-size="30" font-weight="600" text-anchor="middle">Released</text><path d="M296 565L382 565" stroke="#52616c" stroke-width="2" /><rect x="386" y="513" width="262" height="105" rx="16" fill="#1c2228" stroke="#edc48b" stroke-width="1.5"/><text x="517" y="577" fill="#edc48b" font-size="29" font-weight="600" text-anchor="middle">Still valid?</text><text x="340" y="667" fill="#edc48b" font-size="22" font-weight="600" text-anchor="middle">INCONSISTENT STATE</text><text x="340" y="705" fill="#adbbc6" font-size="23" font-weight="400" text-anchor="middle">The object is gone; the reference remains.</text></g></svg>