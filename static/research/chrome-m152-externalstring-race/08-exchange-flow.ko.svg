<svg xmlns="http://www.w3.org/2000/svg" width="680" height="1480" viewBox="0 0 680 1480" role="img" aria-labelledby="title desc"><title id="title">B · exchange 호출과 빌드 분기</title><desc id="desc">ExternalPointerMember exchange delegates to a field operation. The sandbox path reads one handle and exchanges an EPT entry; the other path reads and writes an address field.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 Z" fill="#a8dfc7" /></marker><marker id="retry" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 Z" fill="#edc48b" /></marker></defs><rect width="680" height="1480" rx="16" fill="#111519" /><text x="340" y="45" text-anchor="middle" fill="#a8dfc7" font-size="28" font-family="system-ui,Malgun Gothic,Noto Sans KR,sans-serif"><tspan x="340" dy="0">B · exchange 호출과 빌드 분기</tspan></text><rect x="80" y="92.5" width="520" height="105" rx="12" fill="#191f25" stroke="#3f4b55" stroke-width="2" /><text x="340.0" y="136.66" text-anchor="middle" fill="#e7edf1" font-size="24" font-family="system-ui,Malgun Gothic,Noto Sans KR,sans-serif"><tspan x="340.0" dy="0">ExternalPointerMember::exchange</tspan><tspan x="340.0" dy="33">single tag → exchange&lt;tag&gt;</tspan></text><path d="M340,197.5 V240" fill="none" stroke="#a8dfc7" stroke-width="2.5" marker-end="url(#arrow)" /><rect x="80" y="240" width="520" height="140" rx="12" fill="#191f25" stroke="#3f4b55" stroke-width="2" /><text x="340.0" y="285.16" text-anchor="middle" fill="#e7edf1" font-size="24" font-family="system-ui,Malgun Gothic,Noto Sans KR,sans-serif"><tspan x="340.0" dy="0">exchange&lt;tag&gt;</tspan><tspan x="340.0" dy="33">storage_ → field_address</tspan><tspan x="340.0" dy="33">isolate / value 전달</tspan></text><path d="M340,380 V430" fill="none" stroke="#a8dfc7" stroke-width="2.5" marker-end="url(#arrow)" /><rect x="80" y="430" width="520" height="70" rx="12" fill="#191f25" stroke="#3f4b55" stroke-width="2" /><text x="340.0" y="473.16" text-anchor="middle" fill="#e7edf1" font-size="24" font-family="system-ui,Malgun Gothic,Noto Sans KR,sans-serif"><tspan x="340.0" dy="0">ExchangeExternalPointerField&lt;tag&gt;</tspan></text><path d="M340,500 V537.5" fill="none" stroke="#a8dfc7" stroke-width="2.5" marker-end="url(#arrow)" /><polygon points="340,537.5 600,632.5 340,727.5 80,632.5" fill="#1c2928" stroke="#a8dfc7" stroke-width="2" /><text x="340.0" y="624.16" text-anchor="middle" fill="#e7edf1" font-size="24" font-family="system-ui,Malgun Gothic,Noto Sans KR,sans-serif"><tspan x="340.0" dy="0">V8_ENABLE_SANDBOX</tspan><tspan x="340.0" dy="33">컴파일 시 선택</tspan></text><path d="M80,632.5 H15 V740 H165 V781.5" fill="none" stroke="#a8dfc7" stroke-width="2.5" marker-end="url(#arrow)" /><text x="62" y="725" text-anchor="middle" fill="#e7edf1" font-size="22" font-family="system-ui,Malgun Gothic,Noto Sans KR,sans-serif"><tspan x="62" dy="0">ON</tspan></text><path d="M600,632.5 H665 V740 H515 V781.5" fill="none" stroke="#a8dfc7" stroke-width="2.5" marker-end="url(#arrow)" /><text x="620" y="725" text-anchor="middle" fill="#e7edf1" font-size="22" font-family="system-ui,Malgun Gothic,Noto Sans KR,sans-serif"><tspan x="620" dy="0">OFF</tspan></text><rect x="15" y="781.5" width="300" height="132" rx="12" fill="#191f25" stroke="#3f4b55" stroke-width="2" /><text x="165.0" y="823.98" text-anchor="middle" fill="#e7edf1" font-size="22" font-family="system-ui,Malgun Gothic,Noto Sans KR,sans-serif"><tspan x="165.0" dy="0">handle 원자적 읽기</tspan><tspan x="165.0" dy="31">Relaxed_ReadExternal</tspan><tspan x="165.0" dy="31">PointerHandle</tspan></text><rect x="365" y="781.5" width="300" height="132" rx="12" fill="#191f25" stroke="#3f4b55" stroke-width="2" /><text x="515.0" y="823.98" text-anchor="middle" fill="#e7edf1" font-size="22" font-family="system-ui,Malgun Gothic,Noto Sans KR,sans-serif"><tspan x="515.0" dy="0">필드의 이전 주소 읽기</tspan><tspan x="515.0" dy="31">ReadMaybeUnaligned</tspan><tspan x="515.0" dy="31">Value&lt;Address&gt;</tspan></text><path d="M165,913.5 V964" fill="none" stroke="#a8dfc7" stroke-width="2.5" marker-end="url(#arrow)" /><path d="M515,913.5 V964" fill="none" stroke="#a8dfc7" stroke-width="2.5" marker-end="url(#arrow)" /><rect x="15" y="964" width="300" height="132" rx="12" fill="#191f25" stroke="#3f4b55" stroke-width="2" /><text x="165.0" y="1006.48" text-anchor="middle" fill="#e7edf1" font-size="22" font-family="system-ui,Malgun Gothic,Noto Sans KR,sans-serif"><tspan x="165.0" dy="0">태그로 테이블 선택</tspan><tspan x="165.0" dy="31">GetExternalPointer</tspan><tspan x="165.0" dy="31">TableFor(tag)</tspan></text><rect x="365" y="964" width="300" height="132" rx="12" fill="#191f25" stroke="#3f4b55" stroke-width="2" /><text x="515.0" y="1006.48" text-anchor="middle" fill="#e7edf1" font-size="22" font-family="system-ui,Malgun Gothic,Noto Sans KR,sans-serif"><tspan x="515.0" dy="0">필드에 value 쓰기</tspan><tspan x="515.0" dy="31">WriteMaybeUnaligned</tspan><tspan x="515.0" dy="31">Value&lt;Address&gt;</tspan></text><path d="M165,1096 V1131.5" fill="none" stroke="#a8dfc7" stroke-width="2.5" marker-end="url(#arrow)" /><path d="M515,1096 V1260" fill="none" stroke="#a8dfc7" stroke-width="2.5" marker-end="url(#arrow)" /><rect x="15" y="1131.5" width="300" height="132" rx="12" fill="#191f25" stroke="#3f4b55" stroke-width="2" /><text x="165.0" y="1173.98" text-anchor="middle" fill="#e7edf1" font-size="22" font-family="system-ui,Malgun Gothic,Noto Sans KR,sans-serif"><tspan x="165.0" dy="0">ExternalPointerTable</tspan><tspan x="165.0" dy="31">::Exchange</tspan><tspan x="165.0" dy="31">한 EPT 항목 교환</tspan></text><path d="M165,1263.5 V1320 H340 V1367.5" fill="none" stroke="#a8dfc7" stroke-width="2.5" marker-end="url(#arrow)" /><path d="M515,1260 V1320 H340" fill="none" stroke="#a8dfc7" stroke-width="2.5" marker-end="url(#arrow)" /><rect x="80" y="1367.5" width="520" height="70" rx="12" fill="#191f25" stroke="#3f4b55" stroke-width="2" /><text x="340.0" y="1410.66" text-anchor="middle" fill="#e7edf1" font-size="24" font-family="system-ui,Malgun Gothic,Noto Sans KR,sans-serif"><tspan x="340.0" dy="0">이전 주소를 호출자로 반환</tspan></text></svg>
