<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 655" role="img" aria-labelledby="title desc" lang="en">
<title id="title">Same bytes · observed behavior · trusted origin</title><desc id="desc">Three independent evidence categories, their observed results, and limits.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b5c7cc"/></marker></defs>
<rect width="960" height="655" rx="22" fill="#10191e"/>
<g font-family="Noto Sans CJK KR, Noto Sans KR, Malgun Gothic, Apple SD Gothic Neo, Arial, sans-serif"><text x="44" y="42" fill="#78d6be" font-size="15" font-weight="600" text-anchor="start">RAW13G / SOURCE &amp; EVIDENCE REVIEW</text><text x="44" y="89" fill="#edf5f4" font-size="30" font-weight="700" text-anchor="start">Same bytes · observed behavior · trusted origin</text><rect x="36" y="126" width="888" height="139" rx="16" fill="#19272e" stroke="#3b515c" stroke-width="1.5"/><rect x="36" y="144" width="4" height="103" rx="2" fill="#78d6be"/><text x="60" y="158" fill="#78d6be" font-size="21" font-weight="600" text-anchor="start">01  Archive consistency</text><text x="60" y="199" fill="#b5c7cc" font-size="21" font-weight="400" text-anchor="start">48 manifest entries match</text><text x="60" y="230" fill="#b5c7cc" font-size="21" font-weight="400" text-anchor="start">15 deployment pairs match</text><text x="477" y="198" fill="#edf5f4" font-size="20" font-weight="400" text-anchor="start">Compares the preserved copies</text><text x="477" y="230" fill="#edf5f4" font-size="20" font-weight="400" text-anchor="start">Does not authenticate the publisher</text><rect x="36" y="283" width="888" height="139" rx="16" fill="#19272e" stroke="#3b515c" stroke-width="1.5"/><rect x="36" y="301" width="4" height="103" rx="2" fill="#78d6be"/><text x="60" y="315" fill="#78d6be" font-size="21" font-weight="600" text-anchor="start">02  Runtime observations</text><text x="60" y="356" fill="#b5c7cc" font-size="21" font-weight="400" text-anchor="start">Two preserved TCP observations</text><text x="60" y="387" fill="#b5c7cc" font-size="21" font-weight="400" text-anchor="start">GoldHEN display: operator report</text><text x="477" y="355" fill="#edf5f4" font-size="20" font-weight="400" text-anchor="start">Connection state at a recorded time</text><text x="477" y="387" fill="#edf5f4" font-size="20" font-weight="400" text-anchor="start">Service identity and privileges unknown</text><rect x="36" y="440" width="888" height="139" rx="16" fill="#19272e" stroke="#3b515c" stroke-width="1.5"/><rect x="36" y="458" width="4" height="103" rx="2" fill="#efbd79"/><text x="60" y="472" fill="#efbd79" font-size="21" font-weight="600" text-anchor="start">03  Origin and behavior</text><text x="60" y="513" fill="#b5c7cc" font-size="21" font-weight="400" text-anchor="start">Binary sizes and hashes available</text><text x="60" y="544" fill="#b5c7cc" font-size="21" font-weight="400" text-anchor="start">Build and signature evidence absent</text><text x="477" y="512" fill="#edf5f4" font-size="20" font-weight="400" text-anchor="start">Identifies the reviewed artifacts</text><text x="477" y="544" fill="#edf5f4" font-size="20" font-weight="400" text-anchor="start">Behavior and trust need more evidence</text><text x="44" y="626" fill="#b5c7cc" font-size="21" font-weight="400" text-anchor="start">Keep each conclusion within the scope of its evidence.</text></g></svg>