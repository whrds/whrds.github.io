<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 650" role="img" aria-labelledby="title desc" lang="en">
<title id="title">Knowing a hash does not establish its origin</title><desc id="desc">A known binary fingerprint supports equality checks but leaves publisher and behavioral trust separate.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b5c7cc"/></marker></defs>
<rect width="960" height="650" rx="22" fill="#10191e"/>
<g font-family="Noto Sans CJK KR, Noto Sans KR, Malgun Gothic, Apple SD Gothic Neo, Arial, sans-serif"><text x="44" y="42" fill="#78d6be" font-size="15" font-weight="600" text-anchor="start">RAW13G / SOURCE &amp; EVIDENCE REVIEW</text><text x="44" y="89" fill="#edf5f4" font-size="30" font-weight="700" text-anchor="start">Knowing a hash does not establish its origin</text><rect x="188" y="122" width="584" height="103" rx="16" fill="#19272e" stroke="#3b515c" stroke-width="1.5"/><text x="480" y="161" fill="#edf5f4" font-size="25" font-weight="600" text-anchor="middle">Identify the binary under review</text><text x="480" y="198" fill="#b5c7cc" font-size="22" font-weight="400" text-anchor="middle">Filename + size + SHA-256</text><path d="M 480 225 V 264 H 252 V 307" fill="none" stroke="#b5c7cc" stroke-width="2" marker-end="url(#arrow)"/><path d="M 480 225 V 264 H 708 V 307" fill="none" stroke="#b5c7cc" stroke-width="2" marker-end="url(#arrow)"/><rect x="40" y="309" width="424" height="247" rx="16" fill="#19272e" stroke="#78d6be" stroke-width="1.5"/><rect x="496" y="309" width="424" height="247" rx="16" fill="#19272e" stroke="#efbd79" stroke-width="1.5"/><text x="65" y="351" fill="#78d6be" font-size="24" font-weight="600" text-anchor="start">Confirmed identity</text><text x="65" y="397" fill="#edf5f4" font-size="20" font-weight="400" text-anchor="start">Archived source/deployed match</text><text x="65" y="431" fill="#edf5f4" font-size="20" font-weight="400" text-anchor="start">The two payload files match</text><text x="65" y="465" fill="#edf5f4" font-size="20" font-weight="400" text-anchor="start"></text><text x="65" y="499" fill="#edf5f4" font-size="20" font-weight="400" text-anchor="start">These claims concern those copies</text><text x="521" y="351" fill="#efbd79" font-size="24" font-weight="600" text-anchor="start">Separate trust evidence</text><text x="521" y="397" fill="#edf5f4" font-size="20" font-weight="400" text-anchor="start">Trusted publisher and release link</text><text x="521" y="431" fill="#edf5f4" font-size="20" font-weight="400" text-anchor="start">Signature or build provenance</text><text x="521" y="465" fill="#edf5f4" font-size="20" font-weight="400" text-anchor="start">Review of the internal behavior</text><text x="521" y="499" fill="#edf5f4" font-size="20" font-weight="400" text-anchor="start">Not established by this package</text><text x="44" y="610" fill="#b5c7cc" font-size="22" font-weight="400" text-anchor="start">The source of the reference hash matters, too.</text></g></svg>