<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 680" role="img" aria-labelledby="title desc" lang="en">
<title id="title">Correlating a Promise with its response</title><desc id="desc">The main thread stores callbacks by ID and matches Worker replies to the waiting Promise.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b5c7cc"/></marker></defs>
<rect width="960" height="680" rx="22" fill="#10191e"/>
<g font-family="Noto Sans CJK KR, Noto Sans KR, Malgun Gothic, Apple SD Gothic Neo, Arial, sans-serif"><text x="44" y="42" fill="#78d6be" font-size="15" font-weight="600" text-anchor="start">RAW13G / SOURCE &amp; EVIDENCE REVIEW</text><text x="44" y="89" fill="#edf5f4" font-size="30" font-weight="700" text-anchor="start">Correlating a Promise with its response</text><rect x="45" y="132" width="230" height="76" rx="16" fill="#19272e" stroke="#78d6be" stroke-width="1.5"/><text x="160" y="179" fill="#78d6be" font-size="22" font-weight="600" text-anchor="middle">Call / reply handling</text><path d="M 160 208 V 580" stroke="#516970" stroke-width="1.5" stroke-dasharray="6 7"/><rect x="365" y="132" width="230" height="76" rx="16" fill="#19272e" stroke="#78d6be" stroke-width="1.5"/><text x="480" y="179" fill="#78d6be" font-size="22" font-weight="600" text-anchor="middle">pending (Map)</text><path d="M 480 208 V 580" stroke="#516970" stroke-width="1.5" stroke-dasharray="6 7"/><rect x="685" y="132" width="230" height="76" rx="16" fill="#19272e" stroke="#78d6be" stroke-width="1.5"/><text x="800" y="179" fill="#78d6be" font-size="22" font-weight="600" text-anchor="middle">Worker</text><path d="M 800 208 V 580" stroke="#516970" stroke-width="1.5" stroke-dasharray="6 7"/><path d="M 160 270 H 480" fill="none" stroke="#b5c7cc" stroke-width="2" marker-end="url(#arrow)"/><text x="320.0" y="254" fill="#edf5f4" font-size="20" font-weight="400" text-anchor="middle">1  Store ID + callbacks</text><path d="M 160 335 H 800" fill="none" stroke="#b5c7cc" stroke-width="2" marker-end="url(#arrow)"/><text x="480.0" y="319" fill="#edf5f4" font-size="20" font-weight="400" text-anchor="middle">2  { id, name, args }</text><path d="M 800 400 H 160" fill="none" stroke="#b5c7cc" stroke-width="2" marker-end="url(#arrow)"/><text x="480.0" y="384" fill="#edf5f4" font-size="20" font-weight="400" text-anchor="middle">3  { id, type, value }</text><path d="M 160 465 H 480" fill="none" stroke="#b5c7cc" stroke-width="2" marker-end="url(#arrow)"/><text x="320.0" y="449" fill="#edf5f4" font-size="20" font-weight="400" text-anchor="middle">4  Look up and remove ID</text><path d="M 480 530 H 160" fill="none" stroke="#b5c7cc" stroke-width="2" marker-end="url(#arrow)"/><text x="320.0" y="514" fill="#edf5f4" font-size="20" font-weight="400" text-anchor="middle">5  Settle matched Promise</text><text x="44" y="618" fill="#b5c7cc" font-size="21" font-weight="400" text-anchor="start">pending is a data structure in the main thread.</text><text x="44" y="649" fill="#b5c7cc" font-size="21" font-weight="400" text-anchor="start">An ID correlates a request; it does not authenticate it.</text></g></svg>